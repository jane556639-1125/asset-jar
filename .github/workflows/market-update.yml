name: Market update
on:
  workflow_dispatch:
    inputs:
      task:
        description: Market to update
        type: choice
        options: [all, fx, us, tw]
        default: all
  schedule:
    - cron: '0 0,10 * * *'
permissions:
  contents: read
concurrency: market-update
jobs:
  fx:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'fx'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u scripts/update_market.py fx
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  us:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'us'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 yfinance
      - run: python -u scripts/update_market.py us
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  tw:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'tw'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u scripts/update_market.py tw
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - run: python -u scripts/update_market.py catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - run: |
          git config user.name 'asset-jar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stock-catalog.json
          git diff --cached --quiet || (git commit -m 'Update stock catalog' && git push)
