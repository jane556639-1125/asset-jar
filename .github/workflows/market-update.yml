name: Market update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,10 * * *'
permissions:
  contents: write
concurrency: market-update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas lxml beautifulsoup4
      - run: python scripts/update_market.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - if: always()
        run: |
          if [ -f stock-catalog.json ]; then
            git config user.name 'asset-jar-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add stock-catalog.json
            git diff --cached --quiet || (git commit -m 'Update stock catalog' && git push)
          fi
