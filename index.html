<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#527A60"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>資產存錢筒｜Asset Jar</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#303630;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px 16px 100px}header{text-align:center;background:#527a60;color:white;padding:24px;border-radius:0 0 35% 8%;}header img{width:130px;border-radius:30px}h1{margin:8px}small{color:#747c73}header small{color:#e1eae3}section{background:white;border:1px solid #e1e3da;border-radius:18px;padding:18px;margin:12px 0}h2{font-size:18px;color:#527a60;margin:0 0 12px}h3{margin:8px 0} .big{font-size:34px;font-weight:750}.gain{color:#c45b5b}.loss{color:#527a60}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.line{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:9px 0}.bar{display:flex;height:14px;border-radius:20px;overflow:hidden;background:#e3e9dd}.pie{width:135px;height:135px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.hole{background:white;width:94px;height:94px;border-radius:50%;display:grid;place-content:center;text-align:center;font-size:13px}.legend{flex:1;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}button,input,select,textarea{font:inherit;border:1px solid #d5ddd2;border-radius:9px;padding:10px;min-width:0}button{background:#527a60;color:white;cursor:pointer}nav button{background:white;color:#737b72;border:0;flex:1;max-width:210px}nav button.active{color:#527a60;font-weight:bold;background:#e3e9dd}label{display:block;font-size:13px;color:#657267;margin:8px 0}input,select,textarea{width:100%;background:white;color:#303630}details{border-top:1px solid #eee;padding:12px 0}summary{cursor:pointer} .tag{font-size:12px;background:#e3e9dd;padding:3px 6px;border-radius:6px} .notice{background:#f3ead6;padding:10px;border-radius:10px;font-size:13px} .muted{background:#e3e9dd;color:#527a60} .danger{background:#a45b55}svg{max-width:100%} @media(max-width:370px){.pie{width:105px;height:105px}.hole{width:72px;height:72px;font-size:11px}.big{font-size:28px}}
</style></head><body><header><img src="icon-192.png" alt="手繪存錢筒"><h1>資產存錢筒</h1><small>Asset Jar · 一點一滴，累積理想生活。</small></header><main id="main"></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), fmt=(n,m='TW')=>Number(n).toLocaleString('en-US',{minimumFractionDigits:m==='US'?2:0,maximumFractionDigits:m==='US'?2:0}), pct=n=>(n>=0?'+':'')+n.toFixed(2)+'%', signed=(n,m='TW')=>`<span class="${n<0?'loss':'gain'}">${n>0?'+':''}${fmt(n,m)}</span>`, colors=['#C49D93','#D6B49A','#D9D1A7','#B6C3A7','#91B5AC'];
const seed={fx:32.945,opening:[{m:'TW',t:'2330',n:'台積電',b:'國泰證券',k:'現股',q:200,c:170000,f:1},{m:'TW',t:'006208',n:'富邦台50',b:'國泰證券',k:'定期',q:500,c:50000,f:1},{m:'US',t:'VTI',n:'Vanguard 全市場 ETF',b:'Firstrade',k:'現股',q:10,c:2500,f:30}],quotes:{'TW:2330':1200,'TW:006208':125,'US:VTI':300},targets:{'TW:2330':1500,'US:VTI':350},trades:[]};let state;try{state=JSON.parse(localStorage.getItem('asset-jar-test-v1'))||structuredClone(seed)}catch{state=structuredClone(seed)}let page=0,market='TW',sort='v',side='buy',method='現股',tradeTab=0;const save=()=>localStorage.setItem('asset-jar-test-v1',JSON.stringify(state));const key=x=>[x.m,x.t,x.b,x.k].join('|'),symbol=x=>x.m+':'+x.t;
function calc(s=state){let map=new Map(),sales=[];for(let x of s.opening){let a=map.get(key(x))||{...x,q:0,c:0,ct:0};a.q+=x.q;a.c+=x.c;a.ct+=x.c*x.f;map.set(key(x),a)}for(let x of [...s.trades].sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id)){let a=map.get(key(x))||{...x,q:0,c:0,ct:0};if(x.side==='buy'){let c=x.q*x.p+x.fee;a.q+=x.q;a.c+=c;a.ct+=c*x.f}else{if(x.q>a.q+1e-8)throw Error('賣出股數超過庫存：'+x.t);let c=a.c*x.q/a.q,ct=a.ct*x.q/a.q,net=x.q*x.p-x.fee-x.tax;sales.push({...x,g:net-c,gt:net*x.f-ct,ct});a.q-=x.q;a.c-=c;a.ct-=ct}map.set(key(x),a)}let rows=[...map.values()].filter(x=>x.q>1e-8).map(x=>({...x,p:s.quotes[symbol(x)]??null}));let groups=new Map();for(let x of rows){let a=groups.get(symbol(x))||{...x,q:0,c:0,ct:0,parts:[]};a.q+=x.q;a.c+=x.c;a.ct+=x.ct;a.parts.push(x);groups.set(symbol(x),a)}return {rows:[...groups.values()].map(x=>({...x,v:x.p===null?null:x.q*x.p*(x.m==='US'?s.fx:1)})),sales}}
function sums(r){return {v:r.reduce((a,x)=>a+(x.v??0),0),c:r.reduce((a,x)=>a+x.ct,0),missing:r.some(x=>x.v===null)}}function card(n,v){return `<div><small>${n}</small><h3>${v}</h3></div>`}function summary(r){let {v,c,missing}=sums(r);return `<small>庫存總現值 TWD</small><div class="big">${missing?'待補行情':fmt(v)}</div>${missing?'':signed(v-c)+'　'+pct(c?(v-c)/c*100:0)}<div class="grid">${card('總成本',fmt(c))}${card('參考報酬',missing?'—':signed(v-c))}</div>`}
function donut(r,m){let a=r.filter(x=>x.v!==null).sort((a,b)=>b.v-a.v),v=sums(a).v,top=a.slice(0,4);if(a.length>4)top.push({n:'其他',v:a.slice(4).reduce((s,x)=>s+x.v,0)});let pos=0,stops=top.map((x,i)=>{let start=pos;pos+=v?x.v/v*100:0;return `${colors[i]} ${start}% ${pos}%`});return `<section><h2>${m==='TW'?'台股':'美股'}庫存現值比例</h2><div class="line"><div class="pie" style="background:${v?'conic-gradient('+stops.join(',')+')':'#e3e9dd'}"><div class="hole">TWD<br><b>${fmt(v)}</b></div></div><div class="legend">${top.map((x,i)=>`<div class="line"><span><i class="dot" style="background:${colors[i]}"></i>${esc(x.n)}</span>${v?(x.v/v*100).toFixed(1):0}%</div>`).join('')}</div></div><hr>${summary(r)}</section>`}
function render(){let {rows,sales}=calc(),tw=rows.filter(x=>x.m==='TW'),us=rows.filter(x=>x.m==='US'),v=sums(rows).v,w=v?sums(tw).v/v*100:0; $('nav').innerHTML=['總覽','庫存','交易','設定'].map((n,i)=>`<button class="${page===i?'active':''}" onclick="page=${i};render()">${['⌂','▤','⇄','⚙'][i]}<br>${n}</button>`).join('');let html='<div class="notice">V0.1 TEST · 示意行情／本機資料，非即時報價</div>';if(page===0){html+=`<section>${summary(rows)}<small>示意 USD/TWD ${state.fx}（非臺銀實際公告）</small></section><section><h2>台美股資產分布</h2><div class="bar"><div style="width:${w}%;background:#527a60"></div><div style="flex:1;background:#b6c3a7"></div></div><div class="line"><span>台股 ${w.toFixed(1)}%</span><span>美股 ${(v?100-w:0).toFixed(1)}%</span></div></section>${donut(tw,'TW')}${donut(us,'US')}<section><h2>歷史資產走勢</h2><small>測試版尚未建立每日快照，正式版將顯示市值與成本雙線。</small></section><section><h2>投資目標追蹤</h2>${rows.filter(x=>state.targets[symbol(x)]&&x.p!==null).map(x=>{let p=x.p/state.targets[symbol(x)]*100;return `<div class="line">${esc(x.t)} ${esc(x.n)}<b>${p.toFixed(1)}% ${p>=100?'已達標':''}</b></div><div class="bar"><div style="background:#527a60;width:${Math.min(100,p)}%"></div></div>`}).join('')||'尚無目標'}</section>`}if(page===1){let r=rows.filter(x=>x.m===market);r.sort((a,b)=>sort==='t'?a.t.localeCompare(b.t):sort==='c'?b.ct-a.ct:sort==='g'?(b.v-b.ct)-(a.v-a.ct):sort==='r'?(b.v/b.ct)-(a.v/a.ct):(b.v??0)-(a.v??0));html+=`<section><div class="grid"><button onclick="market='TW';render()">台股</button><button onclick="market='US';render()">美股</button></div>${summary(r)}<label>排序<select onchange="sort=this.value;render()">${[['v','市值'],['c','成本'],['g','損益'],['r','報酬率'],['t','代碼']].map(([k,n])=>`<option value="${k}" ${sort===k?'selected':''}>${n}</option>`).join('')}</select></label></section><section><h2>個股庫存</h2>${r.map(x=>`<details><summary><b>${esc(x.t)} ${esc(x.n)}</b> ${[...new Set(x.parts.map(a=>a.k))].map(k=>`<span class="tag">${esc(k)}</span>`).join('')}<div class="line"><small>${x.q} 股</small>${x.v===null?'待補行情':signed(x.v-x.ct)}</div></summary><div class="grid">${card('成交均價',fmt(x.c/x.q,x.m))}${card('市價',x.p===null?'—':fmt(x.p,x.m))}${card('現值（原幣）',x.p===null?'—':fmt(x.q*x.p,x.m))}${card('成本（原幣）',fmt(x.c,x.m))}</div>${x.parts.map(a=>`<div class="line"><small>${esc(a.b)}・${esc(a.k)}</small>${a.q} 股 / ${fmt(a.c,a.m)}</div>`).join('')}<label>期望賣出價（原幣）<input type="number" min="0" step="any" value="${state.targets[symbol(x)]||''}" onchange="setTarget('${esc(symbol(x))}',this.value)"></label></details>`).join('')||'尚無庫存'}</section>`}if(page===2){html+=`<section><div class="grid"><button onclick="tradeTab=0;render()">新增交易</button><button onclick="tradeTab=1;render()">交易紀錄／已實現</button></div></section>`;if(!tradeTab)html+=`<section><h2>新增交易</h2><form id="trade"><div class="grid"><label>買賣<select name="side" onchange="side=this.value;toggleReason()"><option value="buy">買入</option><option value="sell">賣出</option></select></label><label>投資方式<select name="k" onchange="method=this.value;toggleReason()"><option>現股</option><option>定期</option></select></label><label>日期<input name="d" type="date" required value="${new Date().toLocaleDateString('sv-SE')}"></label><label>市場<select name="m" onchange="this.form.f.value=this.value==='US'?state.fx:1"><option value="TW">台股</option><option value="US">美股</option></select></label><label>券商<select name="b"><option>國泰證券</option><option>Firstrade</option></select></label><label>股票代碼<input name="t" required pattern="[A-Za-z0-9.\\-]+"></label><label>股票名稱<input name="n" required></label><label>股數<input name="q" type="number" min="0.000001" step="any" required></label><label>單價<input name="p" type="number" min="0.000001" step="any" required></label><label>手續費<input name="fee" type="number" min="0" step="any" value="0"></label><label>交易稅<input name="tax" type="number" min="0" step="any" value="0"></label><label>交易匯率<input name="f" type="number" min="0.000001" step="any" value="1" required></label></div><div id="reason"><label>交易原因（可多選）<select name="reasons" multiple><option>長期投資</option><option>逢低加碼</option><option>基本面</option><option>達到目標價</option><option>獲利了結</option><option>停損</option><option>資金需求</option><option>資產配置</option><option>其他</option></select></label><label>備註<textarea name="memo"></textarea></label></div><button>儲存交易</button></form></section>`;else html+=`<section><h2>已實現損益（全部）</h2><div class="big">${signed(sales.reduce((a,x)=>a+x.gt,0))}</div><small>台幣，未含股息</small></section><section><h2>交易紀錄</h2>${[...state.trades].reverse().map(x=>`<details><summary>${esc(x.d)} ${esc(x.t)} ${x.side==='buy'?'買入':'賣出'} ${x.q} 股</summary><p>${esc(x.b)}・${esc(x.k)}・${fmt(x.p,x.m)}</p><p>${esc(x.reasons?.join('、'))} ${esc(x.memo)}</p><button class="danger" onclick="removeTrade(${x.id})">刪除</button></details>`).join('')||'尚無交易'}</section>`}if(page===3)html+=`<section><h2>手動行情設定</h2><label>USD/TWD 示意匯率<input type="number" min="0.01" step="any" value="${state.fx}" onchange="if(+this.value>0){state.fx=+this.value;save();render()}"></label>${rows.map(x=>`<label>${esc(x.t)} ${esc(x.n)}（原幣）<input type="number" min="0.000001" step="any" value="${x.p??''}" onchange="setQuote('${esc(symbol(x))}',this.value)"></label>`).join('')}</section><section><h2>資料管理</h2><button onclick="backup()">匯出 JSON</button> <button class="danger" onclick="if(confirm('清除所有測試交易並恢復示意資料？')){state=structuredClone(seed);save();render()}">重置測試資料</button><p><small>目前僅儲存在此瀏覽器，不會跨裝置同步。Google 登入、CSV 匯入、每日行情及快照尚未實作。</small></p></section>`;$('main').innerHTML=html;if($('trade')){$('trade').onsubmit=addTrade;side='buy';method='現股'}}
function toggleReason(){$('reason').hidden=side==='buy'&&method==='定期'}function setTarget(k,v){if(+v>0)state.targets[k]=+v;else delete state.targets[k];save()}function setQuote(k,v){if(+v>0){state.quotes[k]=+v;save();render()}}function addTrade(e){e.preventDefault();let f=new FormData(e.target),x=Object.fromEntries(f);x.reasons=$('reason').hidden?[]:f.getAll('reasons');if($('reason').hidden)x.memo='';for(let k of ['q','p','fee','tax','f'])x[k]=Number(x[k]);x.t=x.t.toUpperCase();x.id=Date.now();if(x.m==='TW')x.f=1;if(x.side==='buy')x.tax=0;let next=structuredClone(state);next.trades.push(x);try{let result=calc(next);if(x.side==='sell'&&!result.rows.some(a=>symbol(a)===symbol(x)))delete next.targets[symbol(x)];state=next;save();alert('已儲存測試交易');render()}catch(e){alert(e.message)}}function removeTrade(id){if(!confirm('確定刪除？'))return;let next=structuredClone(state);next.trades=next.trades.filter(x=>x.id!==id);try{calc(next);state=next;save();render()}catch(e){alert(e.message)}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='asset-jar-test.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
