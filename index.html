function calc(s=state){let map=new Map(),sales=[];for(let x of s.opening){let a=map.get(key(x))||{...x,q:0,c:0,ct:0};a.q+=x.q;a.c+=x.c;a.ct+=x.c*x.f;map.set(key(x),a)}for(let x of [...s.trades].sort((a,b)=>a.d.localeCompare(b.d)||String(a.id).localeCompare(String(b.id)))){let a=map.get(key(x))||{...x,q:0,c:0,ct:0};if(x.side==='buy'){let c=x.q*x.p+x.fee;a.q+=x.q;a.c+=c;a.ct+=c*x.f}else{if(x.q>a.q+1e-8)throw Error('賣出股數超過庫存：'+x.t);let c=a.c*x.q/a.q,ct=a.ct*x.q/a.q,net=x.q*x.p-x.fee-x.tax;sales.push({...x,g:net-c,gt:net*x.f-ct,ct});a.q-=x.q;a.c-=c;a.ct-=ct}map.set(key(x),a)}let rows=[...map.values()].filter(x=>x.q>1e-8).map(x=>({...x,p:s.quotes[symbol(x)]??null}));let groups=new Map();for(let x of rows){let a=groups.get(symbol(x))||{...x,q:0,c:0,ct:0,parts:[]};a.q+=x.q;a.c+=x.c;a.ct+=x.ct;a.parts.push(x);groups.set(symbol(x),a)}return {rows:[...groups.values()].map(x=>({...x,v:x.p===null||(x.m==='US'&&!s.fx)?null:x.q*x.p*(x.m==='US'?s.fx:1)})),sales}}

let historyRows=[],historyDays=30;function historyChart(){let cutoff=new Date(Date.now()-historyDays*86400000).toISOString().slice(0,10),r=historyRows.filter(x=>x.snapshot_date>=cutoff);let max=Math.max(1,...r.flatMap(x=>[+x.market_value_twd,+x.total_cost_twd]));let points=k=>r.map((x,i)=>`${35+i*285/Math.max(1,r.length-1)},${155-135*x[k]/max}`).join(' ');return `<section><h2>歷史資產走勢</h2><div class="line">${[7,30,90,180,365,36500].map(d=>`<button class="${historyDays===d?'':'muted'}" onclick="historyDays=${d};render()">${({7:'1週',30:'1月',90:'3月',180:'半年',365:'1年',36500:'全部'})[d]}</button>`).join('')}</div>${r.length?`<svg viewBox="0 0 340 180" width="100%"><text x="0" y="15" font-size="10">${fmt(max)}</text><polyline points="${points('market_value_twd')}" fill="none" stroke="#527A60" stroke-width="2.5"/><polyline points="${points('total_cost_twd')}" fill="none" stroke="#D6B49A" stroke-width="2.5"/>${r.map((x,i)=>`<circle cx="${35+i*285/Math.max(1,r.length-1)}" cy="${155-135*x.market_value_twd/max}" r="4" fill="#527A60"><title>${x.snapshot_date} 市值 ${fmt(x.market_value_twd)} 成本 ${fmt(x.total_cost_twd)}</title></circle>`).join('')}<text x="35" y="175" font-size="10">${r[0].snapshot_date}</text><text x="320" y="175" text-anchor="end" font-size="10">${r.at(-1).snapshot_date}</text></svg><small>🟢 資產現值　🟤 持股成本</small>`:'<small>尚無有效快照，將逐日累積。</small>'}</section>`}async function marketCloud(){try{let cat=await fetch('./stock-catalog.json',{cache:'no-store'});if(cat.ok)Object.assign(catalog.TW,(await cat.json()).TW||{})}catch{};let today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'});try{let rr=await checked(db.from('exchange_rates').select('rate_date,mid_rate').order('rate_date',{ascending:false}).limit(1000));rates=Object.fromEntries(rr.map(x=>[x.rate_date,+x.mid_rate]));let k=rr.find(x=>x.rate_date<today);if(k){state.fx=+k.mid_rate;state.fxDate=k.rate_date}for(let x of calc().rows){let q=await checked(db.from('stock_prices').select('close_price,price_date').eq('market',x.m).eq('ticker',x.t).lte('price_date',today).order('price_date',{ascending:false}).limit(1));if(q.length)state.quotes[symbol(x)]=+q[0].close_price}historyRows=await checked(db.from('portfolio_snapshots').select('*').eq('user_id',user.id).order('snapshot_date').limit(1000));baseline=structuredClone(state)}catch(e){message='行情讀取失敗，保留有效資料'} }
startCloud();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
